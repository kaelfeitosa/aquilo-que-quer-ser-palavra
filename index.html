<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Booklet A5</title>
<style>
/* ============ LAYOUT FIXO DO LIVRO (igual ao gerar_booklet.py) ============ */
@page { size: 148mm 210mm; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: Georgia, 'Times New Roman', serif; }

.page { width: 148mm; height: 210mm; background: #f8f2e6; position: relative;
        overflow: hidden; page-break-after: always; }
.page-inner { padding: 14mm 18mm 16mm; height: 100%; }
.ink { color: #29201a; } .red { color: #94241f; }
.gold { color: #b3923f; }
.title-line { text-align: center; font-weight: bold; color: #29201a; }
.title-line.big { font-size: 28pt; line-height: 1.22; }
.title-line.med { font-size: 22pt; line-height: 1.25; }
.author-small { text-align: center; font-size: 11pt; }
.cover-author { text-align: center; font-size: 15pt; font-variant-caps: small-caps;
                letter-spacing: 0.5pt; color: #94241f; margin-top: 6mm; }
.rule { border: none; border-top: 1.2pt solid #b3923f; width: 42%; margin: 4mm auto; }
.rule.short { width: 22%; margin: 2.5mm auto; }
.heading { text-align: center; font-weight: bold; font-size: 14pt; letter-spacing: 1pt; }
.heading.big { font-size: 16pt; }
.sc { font-variant-caps: small-caps; }
.body-text { font-size: 11pt; line-height: 1.6; text-align: justify; orphans: 3; widows: 3; }
.body-text.center { text-align: center; }
.dropcap { min-height: 3.3em; }
.dropcap::first-letter { initial-letter: 2; color: #94241f; font-weight: bold; margin-right: 2mm; }
.signature { text-align: center; font-style: italic; font-size: 12pt; }
.page-num { position: absolute; bottom: 6mm; width: 100%; text-align: center;
            font-style: italic; font-size: 8.5pt; color: #8a7f80; letter-spacing: 2pt; }
.frame { border: 1.5pt solid #b3923f; padding: 2mm; }
.frame-inner { display: block; border: 0.6pt solid #b3923f; padding: 1.5mm; }
.foto-place { border: 1.5pt solid #b3923f; color: #9a8f80; font-style: italic;
              display: flex; align-items: center; justify-content: center; }
.band-top { position: absolute; top: 0; left: 0; width: 100%; height: 3mm; background: #94241f; }
.band-bottom { position: absolute; bottom: 0; left: 0; width: 100%; height: 3mm; background: #94241f; }
.content img { max-width: 95mm; display: block; margin: 0 auto; }
.content p { font-size: 11pt; line-height: 1.6; text-align: justify; margin: 0 0 4.5mm 0; orphans: 3; widows: 3; }
.content .heading { text-align: center; }
.conto-content p { font-size: 13pt; line-height: 1.65; }
.content .imgwrap { text-align: center; }
.orn { display: block; margin: 3mm auto; }
.ilustrador { display: flex; gap: 6mm; align-items: flex-start; margin-bottom: 8mm; }
.ilustrador .frame { flex: 0 0 auto; }
.ilustrador .txt { flex: 1; }
.ilustrador .nome { font-weight: bold; font-size: 12pt; color: #29201a; margin-bottom: 1.5mm; }
.ilustrador .funcao { font-variant-caps: small-caps; letter-spacing: 0.5pt; color: #94241f;
                      font-size: 10pt; margin: 1mm 0 2mm; }
.ilustrador .bio { font-size: 10pt; line-height: 1.55; text-align: justify; color: #29201a; }
.ilustrador .bio + .bio { margin-top: 2mm; }
.equipe-foto { display: block; margin: 0 auto; }

/* ============ APP / FORM (somente tela) ============ */
:root {
  --red: #94241f;
  --cream: #f8f2e6;
  --gold: #b3923f;
  --ink: #29201a;
  --bg: #e9e4da;
}
body.app { background: var(--bg); }
.app { min-height: 100vh; display: flex; flex-direction: column; font-family: Georgia, serif; }
.main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* Toolbar fixa no topo */
.toolbar { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid #ddd;
           padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar .brand { font-size: 13pt; font-weight: bold; color: var(--red); margin-right: auto; }
.toolbar .count-badge { font-size: 9pt; color: #666; background: #f3f0ea; border-radius: 12px; padding: 4px 10px; }
.toolbar .act { font-size: 10pt; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--gold);
                background: #fbf4e3; color: #6b4d16; cursor: pointer; min-height: 40px; font-family: Georgia, serif; }
.toolbar .act.primary { background: var(--red); color: #fff; border-color: var(--red); }
.toolbar .act:hover { filter: brightness(0.95); }
.toolbar details { position: relative; }
.toolbar details .menu { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid #ddd;
                         border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.15); padding: 8px; display: flex;
                         flex-direction: column; gap: 6px; min-width: 180px; }
.toolbar details .menu .act { width: 100%; }

/* Tabs (mobile) */
.tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 49; }
.tabs button { flex: 1; padding: 13px; font-size: 11pt; border: none; background: transparent;
               color: #777; border-bottom: 3px solid transparent; cursor: pointer; font-family: Georgia, serif; }
.tabs button.active { color: var(--red); border-bottom-color: var(--red); font-weight: bold; }

/* Panes */
.pane { display: none; }
.pane.active { display: block; }

.panel { background: var(--bg); padding: 12px; overflow-y: auto; }
.card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px;
        box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.card h2 { font-size: 11.5pt; color: var(--red); margin-bottom: 8px; display: flex;
           align-items: center; justify-content: space-between; }
.panel label { display: block; font-size: 9.5pt; color: #555; margin: 9px 0 3px; }
.panel input[type=text], .panel textarea { width: 100%; font-family: Georgia, serif; font-size: 11pt;
    padding: 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
.panel textarea { min-height: 70px; resize: vertical; }
.panel input:focus, .panel textarea:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
.panel input[readonly] { background: #f3f0ea; color: #666; cursor: default; outline: none; }
.panel .img-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.panel .img-row input[type=file] { flex: 1; min-width: 0; font-size: 9pt; }
.panel .thumb { width: 56px; height: 42px; object-fit: cover; border: 1px solid #ccc; border-radius: 6px; background: #f3f3f3; }
.panel .thumb[src=""], .panel .thumb:not([src]) { visibility: hidden; }
.panel button { font-family: Georgia, serif; font-size: 10pt; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--gold); background: #fbf4e3; color: #6b4d16; cursor: pointer; min-height: 40px; }
.panel button:hover { background: #f3e6c5; }
.panel button.primary { background: var(--red); color: #fff; border-color: var(--red); }
.panel button.danger { border-color: #b00; background: #fff; color: #b00; }
.panel .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.part { border: 1px solid #e2d6c2; background: #fdfaf3; padding: 10px; margin-bottom: 10px; border-radius: 10px; }
.part-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.part-head h3 { font-size: 10.5pt; color: var(--red); }
.part-actions { display: flex; gap: 4px; }
.part-actions button { min-height: 32px; padding: 4px 8px; }
.hist-item { border: 1px solid #eee; border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #fafafa; }
.hist-item .nm { font-size: 10.5pt; font-weight: bold; }
.hist-item .dt { font-size: 8.5pt; color: #888; }
.hist-item .hb { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.preview { flex: 1; overflow-y: auto; padding: 14px; background: var(--bg); }
.preview-inner, #pages { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.page-block { display: flex; flex-direction: column; align-items: center; }
.page-scaled { overflow: hidden; }
.preview .page { box-shadow: 0 2px 10px rgba(0,0,0,.22); margin: 0; }
.page-label { font-size: 9pt; color: #8a7f72; font-style: italic; margin-top: 6px; text-align: center; }
.hint { font-size: 9pt; color: #777; }
.count { font-size: 9pt; color: #555; margin-bottom: 6px; text-align: center; }

/* Seletor compacto de gênero por pessoa [ ♀ | ♂ ] ao lado do nome */
.name-row { display: flex; gap: 6px; align-items: stretch; }
.name-row input[type=text] { flex: 1; min-width: 0; }
.panel button.g-btn { min-width: 36px; padding: 0 10px; font-size: 11.5pt;
                      background: #fff; color: var(--ink); border: 1px solid #ccc; }
.panel button.g-btn:hover { background: #fbf4e3; }
.panel button.g-btn.active { background: var(--red); color: #fff; border-color: var(--red); font-weight: bold; }

/* Desktop: sidebar + preview com scroll independente */
@media (min-width: 900px) {
  .main { flex-direction: row; height: calc(100vh - 57px); }
  .tabs { display: none; }
  .pane { display: block !important; }
  .panel { flex: 0 0 400px; border-right: 1px solid #ddd; height: 100%; overflow-y: auto; }
  .preview { flex: 1; height: 100%; }
}

/* ============ IMPRESSÃO ============ */
@media print {
  body { background: #fff; }
  .toolbar, .tabs { display: none !important; }
  .panel { display: none !important; }
  .preview { padding: 0; display: block; overflow: visible; }
  .preview-inner, #pages { gap: 0; display: block; }
  .page-block { display: block; }
  .page-label { display: none; }
  .page-scaled { width: auto !important; height: auto !important; overflow: visible; }
  .preview .page { box-shadow: none; margin: 0; transform: none !important; width: 148mm; height: 210mm; }
  .count { display: none; }
}
</style>
</head>
<body class="app">
<div class="app">
  <div class="toolbar">
    <span class="brand">Booklet A5</span>
    <span class="count-badge" id="page_count">…</span>
    <button type="button" class="act primary" id="btn_print">Imprimir / PDF</button>
    <button type="button" class="act" id="btn_save">Salvar</button>
    <button type="button" class="act" id="add_part">+ Página</button>
    <details>
      <summary class="act">Mais</summary>
      <div class="menu">
        <button type="button" class="act" id="btn_md">Exportar .md</button>
        <button type="button" class="act" id="btn_imp_md">Importar .md</button>
        <button type="button" class="act" id="btn_reset">Reset exemplo</button>
        <input type="file" id="imp_md" accept=".md,text/markdown" style="display:none">
      </div>
    </details>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="edit" class="active">Editar</button>
    <button data-tab="view">Ver</button>
  </div>

  <div class="main">
  <aside class="panel pane active" id="panel">
    <div class="card">
      <h2>Ficha</h2>
      <label>Título do Livro</label><input type="text" id="f_titulo">
      <label id="lbl_autora">Autora</label>
      <div class="name-row">
        <input type="text" id="f_autora">
        <button type="button" class="g-btn active" id="f_gen_f" title="Feminino">♀</button>
        <button type="button" class="g-btn" id="f_gen_m" title="Masculino">♂</button>
      </div>
      <label>Local</label><input type="text" id="f_local">
      <label>Ano</label><input type="text" id="f_ano">
      <label>Acompanhamento Pedagógico</label><input type="text" id="f_pedagogico">
      <label>Escola</label><input type="text" id="f_escola">
      <label>Foto da capa</label>
      <div class="img-row">
        <img class="thumb" id="t_capa" alt="">
        <input type="file" id="up_capa" accept="image/*">
        <button type="button" id="r_capa">Padrão</button>
      </div>
    </div>

    <div class="card">
      <h2>Apresentação</h2>
      <label>Título da apresentação</label><input type="text" id="a_heading">
      <label>Texto (parágrafos separados por linha em branco)</label>
      <textarea id="a_paras" style="min-height:120px"></textarea>
    </div>

    <div class="card">
      <h2>Conto</h2>
      <div id="conto_list"></div>
      <button type="button" class="primary" id="add_part_card">+ Adicionar página</button>
    </div>

    <div class="card">
      <h2 id="card_sobre_title">Sobre a autora</h2>
      <div id="autores_list"></div>
      <button type="button" class="primary" id="add_autor">+ Adicionar coautor(a)</button>
    </div>

    <div class="card" id="card_ilustradores">
      <h2 id="card_ilust_title">Ilustradores (opcional)</h2>
      <p class="hint" id="ilust_hint" style="margin-bottom:8px; line-height: 1.4;"></p>
      <div id="ilust_list"></div>
      <button type="button" class="primary" id="add_ilust">+ Adicionar ilustrador(a)</button>
    </div>

    <div class="card">
      <h2>A equipe</h2>
      <label>Foto de todos</label>
      <div class="img-row">
        <img class="thumb" id="t_grupo" alt="">
        <input type="file" id="up_grupo" accept="image/*">
        <button type="button" id="r_grupo">Padrão</button>
      </div>
      <label>Símbolo de Guaramiranga</label>
      <div class="img-row">
        <img class="thumb" id="t_simbolo" alt="">
        <input type="file" id="up_simbolo" accept="image/*">
        <button type="button" id="r_simbolo">Padrão</button>
      </div>
      <label>Legenda (opcional)</label>
      <input type="text" id="e_legenda">
    </div>

    <div class="card">
      <h2>Histórico (navegador)</h2>
      <div id="history"></div>
    </div>
  </aside>

  <main class="preview pane" id="preview">
    <div class="preview-inner" id="preview-inner">
      <div id="pages"></div>
    </div>
  </main>
</div>
</div>

<script>
'use strict';
/* ============================================================
   ESTADO E NORMALIZAÇÃO (Unificado por pessoa)
   ============================================================ */
const DEFAULT_IMAGE_CAPA = 'ilustracoes/foto_capa.png';
const DEFAULT_IMAGE_CONTO = 'ilustracoes/foto_historia.png';
const DEFAULT_IMAGE_FOTO = 'ilustracoes/placeholder.png';

function exampleState() {
  return {
    meta: {
      titulo: 'A Flor e o Pássaro Vermelho',
      local: 'Sua Cidade – UF',
      ano: '2026',
      pedagogico: 'Nome do(a) Orientador(a)',
      escola: 'Nome da Escola',
      foto_capa: DEFAULT_IMAGE_CAPA
    },
    apresentacao: {
      heading: 'Aquilo que quer ser palavra',
      paras: 'Escreva aqui a apresentação do projeto: o que inspirou o livro, como foi feito e quem participou. Este texto flui automaticamente para quantas páginas forem necessárias — basta escrever mais parágrafos.\n\nCada parágrafo, separado por uma linha em branco, vira um bloco de texto na página. Você também pode usar *itálico* e **negrito** normalmente.'
    },
    conto: [
      { text: 'Era uma vez uma flor que era muito solitária, até que, um belo dia, um pássaro apareceu.', image: DEFAULT_IMAGE_CONTO },
      { text: 'O pássaro se aproximou da flor e percebeu que ela estava triste. Então, perguntou o que havia acontecido, e ela respondeu que se sentia muito sozinha.', image: '' },
      { text: 'Ele perguntou se ela gostaria de ter companhia, e ela aceitou. Os dois começaram a conversar sobre a vida e ficaram ali, trocando histórias até o anoitecer.', image: '' },
      { text: 'Quando ficou bem tarde, os dois foram dormir. No dia seguinte, o pássaro saiu para procurar comida para eles, enquanto a flor ficou esperando por ele. De repente, começou a chover, e a flor ficou toda molhada.', image: '' },
      { text: 'O pássaro demorou um pouquinho, e a flor já estava achando que ele a tinha abandonado de vez. Demorou um tempinho que, para a flor, pareceu uma eternidade. Mas o pássaro voltou para ficar de vez, e a flor ficou tão contente! Dali em diante, eles continuaram juntos e viveram felizes para sempre.', image: '' }
    ],
    autores: [
      {
        nome: 'Nome da Autora',
        genero: 'f',
        foto: DEFAULT_IMAGE_FOTO,
        bio: 'Escreva aqui a biografia do autor ou da autora: nome, idade, onde mora e o que gosta de fazer.'
      }
    ],
    ilustradores: [
      { nome: 'Nome do Ilustrador da Capa', genero: 'm', funcao: 'Ilustrações da capa', foto: 'ilustracoes/placeholder.png',
        bio: 'Escreva aqui um pequeno texto sobre quem ilustrou a capa: idade, hobbies e o que mais gosta.' },
      { nome: 'Nome da Ilustradora do Conto', genero: 'f', funcao: 'Ilustrações do conto', foto: 'ilustracoes/placeholder.png',
        bio: 'Escreva aqui um pequeno texto sobre quem ilustrou o conto: idade, hobbies e o que mais gosta.' }
    ],
    equipe: {
      grupo: 'ilustracoes/placeholder.png',
      simbolo: 'ilustracoes/guaramirangua.png',
      legenda: ''
    }
  };
}

function inferGen(nome, fallback) {
  if (/autora|ilustradora/i.test(nome || '')) return 'f';
  if (/autor|ilustrador/i.test(nome || '')) return 'm';
  return fallback || 'f';
}

function normalizeState(s) {
  if (!s) return exampleState();
  if (!s.meta) s.meta = {};
  if (!s.meta.foto_capa) s.meta.foto_capa = DEFAULT_IMAGE_CAPA;

  // Retrocompatibilidade com formato original (meta.autora + sobre.bio/foto)
  if (!Array.isArray(s.autores) || !s.autores.length) {
    const legacySobre = s.sobre || {};
    if (Array.isArray(legacySobre.autores) && legacySobre.autores.length) {
      s.autores = legacySobre.autores.map(a => ({
        nome: a.nome || '',
        genero: (a.genero === 'f' || a.genero === 'm') ? a.genero : inferGen(a.nome, 'f'),
        foto: a.foto || DEFAULT_IMAGE_FOTO,
        bio: a.bio || ''
      }));
    } else {
      const n0 = s.meta.autora || '';
      s.autores = [{
        nome: n0,
        genero: inferGen(n0, 'f'),
        foto: legacySobre.foto !== undefined ? legacySobre.foto : DEFAULT_IMAGE_FOTO,
        bio: legacySobre.bio || ''
      }];
    }
  } else {
    s.autores.forEach(a => {
      if (a.genero !== 'f' && a.genero !== 'm') a.genero = inferGen(a.nome, 'f');
    });
  }
  delete s.sobre;

  if (!s.apresentacao) s.apresentacao = { heading: '', paras: '' };
  if (!Array.isArray(s.conto)) s.conto = [];
  if (!Array.isArray(s.ilustradores)) s.ilustradores = [];
  s.ilustradores.forEach(il => {
    if (il.genero !== 'f' && il.genero !== 'm') il.genero = inferGen(il.nome, 'm');
  });
  if (!s.equipe) s.equipe = { grupo: '', simbolo: '', legenda: '' };
  return s;
}

let state = exampleState();

/* ============================================================
   HELPERS E CONCORDÂNCIA AUTOMÁTICA
   ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function mdInline(s) {
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}
function orn(color) {
  color = color || '#b3923f';
  return '<svg class="orn" width="30mm" height="5mm" viewBox="0 0 120 20">' +
    '<line x1="4" y1="10" x2="46" y2="10" stroke="' + color + '" stroke-width="1.2"/>' +
    '<circle cx="60" cy="10" r="2.4" fill="' + color + '"/>' +
    '<line x1="74" y1="10" x2="116" y2="10" stroke="' + color + '" stroke-width="1.2"/></svg>';
}
function splitTitle(t) {
  const words = String(t || '').split(/\s+/).filter(Boolean);
  if (!words.length) return ['', ''];
  if (words.length === 1) return [words[0], ''];
  let best = 1, bestCost = Infinity;
  for (let k = 1; k < words.length; k++) {
    const cost = Math.abs(words.slice(0, k).join(' ').length - words.slice(k).join(' ').length);
    if (cost < bestCost) { bestCost = cost; best = k; }
  }
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
}
function paragraphs(text) {
  return String(text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
}

function formatNomesList(nomes) {
  if (nomes.length <= 1) return nomes[0] || '';
  return nomes.slice(0, -1).join(', ') + ' e ' + nomes[nomes.length - 1];
}

function autoresStr() {
  return formatNomesList((state.autores || []).map(a => (a.nome || '').trim()).filter(Boolean));
}

function getSobreTitulo() {
  const auts = state.autores || [];
  const isSame = (!state.ilustradores || state.ilustradores.length === 0);
  const allFem = auts.length > 0 && auts.every(a => a.genero !== 'm');
  if (auts.length > 1) {
    if (allFem) return isSame ? 'Sobre as autoras e ilustradoras' : 'Sobre as autoras';
    return isSame ? 'Sobre os autores e ilustradores' : 'Sobre os autores';
  }
  if (allFem) return isSame ? 'Sobre a autora e ilustradora' : 'Sobre a autora';
  return isSame ? 'Sobre o autor e ilustrador' : 'Sobre o autor';
}

function getIlustTitulo() {
  const ils = state.ilustradores || [];
  const allFem = ils.length > 0 && ils.every(x => x.genero === 'f');
  if (ils.length === 1) return allFem ? 'Ilustradora' : 'Ilustrador';
  return allFem ? 'Ilustradoras' : 'Ilustradores';
}

/* ============================================================
   MEDIÇÃO (paginação da apresentação)
   ============================================================ */
const _ctx = document.createElement('canvas').getContext('2d');
function measureLines(text, sizePt) {
  _ctx.font = sizePt + 'pt Georgia, serif';
  const cw = 112 * 3.7795;
  const words = text.split(/\s+/);
  let lines = 1, cur = '';
  for (const w of words) {
    const trial = cur ? cur + ' ' + w : w;
    if (_ctx.measureText(trial).width <= cw) cur = trial;
    else { lines++; cur = w; }
  }
  return lines;
}
function paraHeight(text, sizePt) {
  return measureLines(text, sizePt) * sizePt * 1.6 + sizePt * 0.6;
}
function paginate(items, hasHeading) {
  const pages = [[]];
  let curH = 0, avail = hasHeading ? 445 : 505;
  for (const it of items) {
    const h = paraHeight(it.text, it.size);
    if (curH + h > avail) { pages.push([]); curH = 0; avail = 505; }
    pages[pages.length - 1].push(it.html);
    curH += h;
  }
  return pages;
}

function buildApresentacao() {
  const a = state.apresentacao, m = state.meta;
  const items = paragraphs(a.paras).map(p => ({ html: '<p>' + mdInline(p) + '</p>', text: p, size: 11 }));
  if (m.pedagogico) {
    items.push({ html: '<p class="signature red">' + esc(m.pedagogico) + '</p>', text: m.pedagogico, size: 12 });
  }
  if (!a.heading && !items.length) return [];
  const pgs = paginate(items, Boolean(a.heading));
  return pgs.map((blocks, i) => {
    if (i === 0 && a.heading) {
      blocks = [orn(), '<p class="heading red sc">' + esc(a.heading) + '</p>\n<hr class="rule" style="width:30%">'].concat(blocks);
    }
    return pageApresentacao(blocks.join('\n'), 3 + i);
  });
}

function render() {
  const pages = [], nums = [];
  const push = (html, num) => { pages.push(html); nums.push(num); };
  push(pageCapa(), null);
  push(pageRosto(2), 2);
  const ap = buildApresentacao();
  ap.forEach((h, i) => push(h, 3 + i));
  state.conto.forEach((part, i) => {
    push(pageConto(part, 3 + ap.length + i, i === 0), 3 + ap.length + i);
  });
  push(pageSobre(pages.length + 1), pages.length + 1);

  // Ilustradores só aparecem se houver ilustradores adicionados
  if (state.ilustradores && state.ilustradores.length > 0) {
    push(pageIlustradores(pages.length + 1), pages.length + 1);
  }
  if (state.equipe && (state.equipe.grupo || state.equipe.simbolo)) {
    push(pageEquipe(pages.length + 1), pages.length + 1);
  }
  push(pageContracapa(), null);
  document.getElementById('pages').innerHTML = pages.map((html, i) =>
    '<div class="page-block"><div class="page-scaled">' + html + '</div>' +
    (nums[i] ? '<div class="page-label">Página ' + nums[i] + '</div>' : '') +
    '</div>'
  ).join('\n');
  document.getElementById('page_count').textContent = pages.length + ' páginas A5';
  requestAnimationFrame(fitPreview);
  setTimeout(fitPreview, 150);
}

/* Escala automática do preview para caber na largura */
const PAGE_W = 559.37, PAGE_H = 793.70; // A5 em px @96dpi
function fitPreview() {
  const preview = document.getElementById('preview');
  const inner = document.getElementById('preview-inner');
  if (!inner || !preview) return;
  const avail = preview.getBoundingClientRect().width;
  const scale = avail > 40 ? Math.min(1, avail / PAGE_W) : 1;
  document.querySelectorAll('.page-scaled').forEach(w => {
    w.style.width = (PAGE_W * scale) + 'px';
    w.style.height = (PAGE_H * scale) + 'px';
    const p = w.firstElementChild;
    p.style.transform = 'scale(' + scale + ')';
    p.style.transformOrigin = 'top left';
  });
}

function moveItem(arr, idx, dir) {
  const k = idx + dir;
  if (k < 0 || k >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[k]; arr[k] = tmp;
  syncForm(); onChange();
}

function swapGenderPlaceholder(name, gen) {
  const s = String(name || '').trim();
  if (gen === 'm') {
    if (s === 'Nome da Autora') return 'Nome do Autor';
    if (s.startsWith('Autora ')) return s.replace(/^Autora /, 'Autor ');
    if (s.startsWith('Nome da Ilustradora')) return s.replace(/^Nome da Ilustradora/, 'Nome do Ilustrador');
  } else {
    if (s === 'Nome do Autor') return 'Nome da Autora';
    if (s.startsWith('Autor ')) return s.replace(/^Autor /, 'Autora ');
    if (s.startsWith('Nome do Ilustrador')) return s.replace(/^Nome do Ilustrador/, 'Nome da Ilustradora');
  }
  return name;
}

function attachAutoresEvents() {
  $('autores_list').addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.anome !== undefined) {
      state.autores[+t.dataset.anome].nome = t.value;
      syncAutorHeaderAndFicha();
    } else if (t.dataset.abio !== undefined) {
      state.autores[+t.dataset.abio].bio = t.value;
    } else return;
    onChange();
  });
  $('autores_list').addEventListener('change', e => {
    if (e.target.type === 'file' && e.target.dataset.afile !== undefined) {
      const idx = +e.target.dataset.afile;
      readImage(e.target.files[0], 1500).then(url => {
        if (url) { state.autores[idx].foto = url; syncForm(); onChange(); }
      });
      e.target.value = '';
    }
  });
  $('autores_list').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.agen !== undefined) {
      const idx = +b.dataset.agen;
      const g = b.dataset.g;
      state.autores[idx].genero = g;
      state.autores[idx].nome = swapGenderPlaceholder(state.autores[idx].nome, g);
      syncForm(); onChange();
    } else if (b.dataset.arm !== undefined && state.autores.length > 1) {
      state.autores.splice(+b.dataset.arm, 1);
      syncForm(); onChange();
    } else if (b.dataset.adef !== undefined) {
      state.autores[+b.dataset.adef].foto = DEFAULT_IMAGE_FOTO;
      syncForm(); onChange();
    } else if (b.dataset.aup !== undefined) {
      moveItem(state.autores, +b.dataset.aup, -1);
    } else if (b.dataset.adn !== undefined) {
      moveItem(state.autores, +b.dataset.adn, 1);
    }
  });
  $('add_autor').addEventListener('click', () => {
    const n = (state.autores ? state.autores.length : 0) + 1;
    state.autores.push({ nome: 'Autora ' + n, genero: 'f', bio: '', foto: DEFAULT_IMAGE_FOTO });
    syncForm(); onChange();
  });
}

/* ============================================================
   UPLOAD / RESIZE
   ============================================================ */
function readImage(file, maxW) {
  return new Promise((res, rej) => {
    if (!file) return res('');
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, (maxW || 1500) / img.width);
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * scale));
      cv.height = Math.max(1, Math.round(img.height * scale));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      res(cv.toDataURL(type, 0.9));
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem inválida')); };
    img.src = url;
  });
}

/* ============================================================
   STORAGE (IndexedDB) + HISTÓRICO
   ============================================================ */
const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('booklet_editor', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('booklets', { keyPath: 'id' });
      r.onsuccess = e => { this.db = e.target.result; res(); };
      r.onerror = e => rej(e);
    });
  },
  put(rec) { return new Promise((res, rej) => { const tx = this.db.transaction('booklets', 'readwrite'); tx.objectStore('booklets').put(rec); tx.oncomplete = res; tx.onerror = rej; }); },
  del(id) { return new Promise((res, rej) => { const tx = this.db.transaction('booklets', 'readwrite'); tx.objectStore('booklets').delete(id); tx.oncomplete = res; tx.onerror = rej; }); },
  all() { return new Promise((res, rej) => { const r = this.db.transaction('booklets', 'readonly').objectStore('booklets').getAll(); r.onsuccess = () => res(r.result); r.onerror = rej; }); }
};
const clone = o => JSON.parse(JSON.stringify(o));

  const d = new Date(ts);

    const wrap = $('history');
    wrap.innerHTML = '';

function download(name, content, type) {
  const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
}

function exportMarkdown() {
  const m = state.meta;
  const auts = state.autores || [];
  const allFem = auts.length > 0 && auts.every(a => a.genero !== 'm');
  const kAutor = auts.length > 1 ? (allFem ? 'autoras' : 'autores') : (allFem ? 'autora' : 'autor');
  const L = [];
  L.push('---');
  L.push('titulo: ' + (m.titulo || ''));
  L.push(kAutor + ': ' + autoresStr());
  L.push('local: ' + (m.local || ''));
  L.push('ano: ' + (m.ano || ''));
  L.push('pedagogico: ' + (m.pedagogico || ''));
  L.push('escola: ' + (m.escola || ''));
  L.push('foto_capa: ' + (m.foto_capa || ''));
  L.push('---', '');

  L.push('## Apresentação', '');
  if (state.apresentacao.heading) L.push('**' + state.apresentacao.heading + '**', '');
  paragraphs(state.apresentacao.paras).forEach(p => L.push(p, ''));

  L.push('## Conto', '');
  state.conto.forEach((part, i) => {
    L.push(part.text.trim(), '');
    if (part.image) L.push('![ilustração](' + part.image + ')', '');
    if (i < state.conto.length - 1) L.push('---', '');
  });

  L.push('## ' + getSobreTitulo(), '');

  if (auts.length > 1) {
    const secAutGen = allFem ? 'f' : 'm';
    auts.forEach(aut => {
      const gTag = (aut.genero !== inferGen(aut.nome, secAutGen)) ? ' <!-- ' + (aut.genero === 'm' ? '♂' : '♀') + ' -->' : '';
      L.push('### ' + aut.nome + gTag, '');
      if (aut.foto) L.push('![ilustração](' + aut.foto + ')', '');
      L.push((aut.bio || '').trim(), '');
      L.push('');
    });
  } else {
    const a0 = auts[0] || { foto: '', bio: '' };
    if (a0.foto) L.push('![ilustração](' + a0.foto + ')', '');
    L.push((a0.bio || '').trim(), '');
  }

  if (state.ilustradores && state.ilustradores.length) {
    const ils = state.ilustradores;
    const secIlGen = ils.every(x => x.genero === 'f') ? 'f' : 'm';
    L.push('## ' + getIlustTitulo(), '');
    ils.forEach(il => {
      const gTag = (il.genero !== inferGen(il.nome, secIlGen)) ? ' <!-- ' + (il.genero === 'f' ? '♀' : '♂') + ' -->' : '';
      L.push('### ' + il.nome + gTag, '');
      if (il.foto) L.push('![ilustração](' + il.foto + ')', '');
      if (il.funcao) L.push('**' + il.funcao + '**', '');
      L.push((il.bio || '').trim(), '');
      L.push('');
    });

  L.push('## A equipe', '');

  if (state.equipe.simbolo) L.push('![ilustração](' + state.equipe.simbolo + ')', '');
  if (state.equipe.legenda) L.push(state.equipe.legenda, '');

  download('template_booklet.md', L.join('\n'), 'text/markdown;charset=utf-8');

function importMarkdown(text) {
  text = String(text || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const fm = text.match(/^---\s*\n([\s\S]*?)\n---\s*(?:\n|$)/);
  let body = text;
  const meta = {};
  if (fm) {
    fm[1].split('\n').forEach(line => {
      const s = line.trim();
      if (!s || s.startsWith('#')) return;
      const i = s.indexOf(':');
      if (i > 0) meta[s.slice(0, i).trim().toLowerCase()] = s.slice(i + 1).trim();
    });
    body = text.slice(fm[0].length);
  }
  body = body.replace(/<!--(?![\s]*[♀♂][\s]*-->)[\s\S]*?-->/g, '');
  const sections = {}, sectionTitles = {};
  let cur = null;
  body.split('\n').forEach(raw => {
    if (raw.startsWith('## ') && !raw.startsWith('### ')) {
      const rawTitle = raw.slice(3).trim();
      cur = rawTitle.toLowerCase();
      sections[cur] = [];
      sectionTitles[cur] = rawTitle;
    }
    else if (cur) sections[cur].push(raw);
  });

  const findSecEntry = (...pats) => {
    for (const pat of pats) {
      if (sections[pat]) return { key: pat, title: sectionTitles[pat], content: sections[pat].join('\n') };
      for (const k in sections) {
        if (k.startsWith(pat)) {
          return { key: k, title: sectionTitles[k], content: sections[k].join('\n') };
        }
      }
    }
    return { key: '', title: '', content: '' };
  };
  const findSec = (...pats) => findSecEntry(...pats).content;

  const apres = findSec('apresentação', 'apresentacao').trim();
  const hm = apres.match(/^\*\*(.+?)\*\*\s*(?:\n|$)/);
  const aHeading = hm ? hm[1].trim() : '';
  const aParas = (hm ? apres.slice(hm[0].length) : apres).trim();

  const contoRaw = findSec('conto', 'historia');
  const conto = [], contoChunks = [];
  let curChunk = [];
  contoRaw.split('\n').forEach(raw => {
    const s = raw.trim();
    if (s.startsWith('### ') || s === '---' || s === '***' || s === '___') {
      if (curChunk.length) { contoChunks.push(curChunk.join('\n')); curChunk = []; }
    } else {
      curChunk.push(raw);
    }
  });
  if (curChunk.length) contoChunks.push(curChunk.join('\n'));
  contoChunks.forEach(chunk => {
    const im = chunk.match(/!\[[^\]]*\]\(([^)]+)\)/);
    const image = im ? im[1] : '';
    const text = chunk.replace(/!\[[^\]]*\]\([^)]+\)/g, '').trim();
    if (text || image) conto.push({ text, image });
  });

  // Sobre / Autores
  const sobreEntry = findSecEntry('sobre');
  const sobreRaw = sobreEntry.content;
  const sobreKey = sobreEntry.key || '';
  const isMascAutor = Boolean((meta.autor && !meta.autora) || meta.autores || (sobreKey.includes('autor') && !sobreKey.includes('autora')));
  const defaultAutGen = isMascAutor ? 'm' : 'f';
  const autorVal = meta.autores || meta.autoras || meta.autora || meta.autor || '';

  const parseSubHeading = (rawHeading, fallbackGen, isMixedCapable) => {
    const gm = rawHeading.match(/<!--\s*([♀♂])\s*-->/);
    const clean = rawHeading.replace(/<!--\s*[♀♂]\s*-->/g, '').trim();
    const gen = gm ? (gm[1] === '♀' ? 'f' : 'm') : (isMixedCapable ? inferGen(clean, fallbackGen) : fallbackGen);
    return { nome: clean, genero: gen };
  };

  const autores = [];
  let curCo = null;
  const hasSubInSobre = sobreRaw.split('\n').some(l => l.trim().startsWith('### '));
  if (hasSubInSobre) {
    sobreRaw.split('\n').forEach(raw => {
      const s = raw.trim();
      if (s.startsWith('### ')) {
        if (curCo) autores.push(curCo);
        const h = parseSubHeading(s.slice(4), defaultAutGen, defaultAutGen === 'm');
        curCo = { nome: h.nome, genero: h.genero, foto: '', bio: [] };
      } else if (curCo) {
        const im = s.match(/!\[[^\]]*\]\(([^)]+)\)/);
        if (im) curCo.foto = im[1];
        else if (!s.startsWith('#')) curCo.bio.push(s);
      }
    });
    if (curCo) autores.push(curCo);
    autores.forEach(x => { x.bio = x.bio.join('\n').replace(/\n{3,}/g, '\n\n').trim(); });
  } else {
    const sFoto = (sobreRaw.match(/!\[[^\]]*\]\(([^)]+)\)/) || [])[1] || '';
    const sBio = sobreRaw.replace(/!\[[^\]]*\]\([^)]+\)/g, '').trim();
    const isPlural = Boolean(meta.autores || meta.autoras || sobreKey.includes('autores') || sobreKey.includes('autoras'));
    if (isPlural && autorVal) {
      const nomes = autorVal.split(/\s*(?:,| e )\s*/).filter(Boolean);
      const pickGen = n => defaultAutGen === 'm' ? inferGen(n, 'm') : 'f';
      autores.push({ nome: nomes[0] || autorVal, genero: pickGen(nomes[0]), foto: sFoto || DEFAULT_IMAGE_FOTO, bio: sBio });
      nomes.slice(1).forEach(n => autores.push({ nome: n, genero: pickGen(n), foto: DEFAULT_IMAGE_FOTO, bio: '' }));
    } else {
      autores.push({ nome: autorVal, genero: defaultAutGen, foto: sFoto, bio: sBio });
    }
  }

  // Ilustradores
  const ilEntry = findSecEntry('ilustra');
  const ilRaw = ilEntry.content;
  const rawIlustTitle = (ilEntry.title || '').trim().toLowerCase();
  const defaultIlustGen = ['ilustradora', 'ilustradoras'].includes(rawIlustTitle) ? 'f' : 'm';
  const isIlustMascPlural = !['ilustradora', 'ilustradoras', 'ilustrador'].includes(rawIlustTitle);
  const ilustradores = [];
  let curIl = null;
  ilRaw.split('\n').forEach(raw => {
    const s = raw.trim();
    if (s.startsWith('### ')) {
      if (curIl) ilustradores.push(curIl);
      const h = parseSubHeading(s.slice(4), defaultIlustGen, isIlustMascPlural);
      curIl = { nome: h.nome, genero: h.genero, foto: '', funcao: '', bio: [] };
    } else if (curIl) {
      const im = s.match(/!\[[^\]]*\]\(([^)]+)\)/);
      if (im) curIl.foto = im[1];
      else if (/^\*\*.+\*\*$/.test(s)) curIl.funcao = s.replace(/^\*\*|\*\*$/g, '');
      else if (!s.startsWith('#')) curIl.bio.push(s);
    }
  });
  if (curIl) ilustradores.push(curIl);
  ilustradores.forEach(x => { x.bio = x.bio.join('\n').replace(/\n{3,}/g, '\n\n').trim(); });
  if (!ilustradores.length && meta.capa) {
    ilustradores.push({ nome: meta.capa, genero: inferGen(meta.capa, 'm'), foto: DEFAULT_IMAGE_FOTO, funcao: 'Capa', bio: '' });
  }

  // A equipe
  const eqRaw = findSec('equipe');
  const eqImgs = [], eqLeg = [];
  eqRaw.split('\n').forEach(raw => {
    const im = raw.match(/!\[[^\]]*\]\(([^)]+)\)/);
    if (im) eqImgs.push(im[1]);
    else if (raw.trim() && !raw.startsWith('#')) eqLeg.push(raw.trim());
  });
  const equipe = { grupo: eqImgs[0] || '', simbolo: eqImgs[1] || '', legenda: eqLeg.join(' ') };

  const hasContoSec = Boolean(findSecEntry('conto', 'historia').key);

  state = {
    meta: {
      titulo: meta.titulo || '',
      local: meta.local || '',
      ano: meta.ano || '',
      pedagogico: meta.pedagogico || '',
      escola: meta.escola || '',
      foto_capa: meta.foto_capa || DEFAULT_IMAGE_CAPA
    },
    apresentacao: { heading: aHeading, paras: aParas },
    conto: conto.length ? conto : (hasContoSec ? [{ text: '', image: '' }] : exampleState().conto),
    autores: autores,
    ilustradores: ilustradores,
    equipe: equipe
  };
  syncForm();
  onChange();
}

    b.addEventListener('click', () => {
      const det = b.closest('details');
      if (det) det.open = false;
    });
  });
  $('imp_md').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importMarkdown(r.result);
    r.readAsText(f, 'utf-8');
    e.target.value = '';
  });

  document.querySelectorAll('#tabs button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      const isEdit = b.dataset.tab === 'edit';
      $('panel').classList.toggle('active', isEdit);
      $('preview').classList.toggle('active', !isEdit);
      fitPreview();
    });
  });

  window.addEventListener('resize', fitPreview);
  attachContoEvents();
  attachAutoresEvents();
  attachIlustEvents();
  historyEvents();
}

bindStaticEvents();
applyAndRender();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPreview);
idb.open().then(() => idb.all()).then(recs => {
  const draft = recs.find(r => r.id === 'draft');
  if (draft && draft.state && !dirty) { state = normalizeState(clone(draft.state)); applyAndRender(); }
  refreshHistory();
}).catch(() => {});
</script>
</body>
</html>
